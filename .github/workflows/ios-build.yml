name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "HomeCleaner/**"
      - "HomeCleaner.xcodeproj/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "HomeCleaner/**"
      - "HomeCleaner.xcodeproj/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable IPA
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build HomeCleaner
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project HomeCleaner.xcodeproj \
            -scheme HomeCleaner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          ditto \
            build/DerivedData/Build/Products/Release-iphoneos/HomeCleaner.app \
            Payload/HomeCleaner.app
          ditto -c -k --sequesterRsrc --keepParent Payload HomeCleaner.ipa
          test -s HomeCleaner.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCleaner-iOS17
          path: HomeCleaner.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HomeCleaner-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
