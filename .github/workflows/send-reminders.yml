name: Send Due Reminders

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          if [ -n "$PUSH_CRON_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PUSH_CRON_SECRET is not configured; skipping."
          fi

      - name: Send reminders
        if: steps.config.outputs.enabled == 'true'
        env:
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "x-cron-secret: $PUSH_CRON_SECRET" \
            https://vptyxdhkqklgjaowbrcj.supabase.co/functions/v1/send-due-reminders
